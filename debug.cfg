# Select the Raspberry Pi Debug Probe (CMSIS-DAP)
adapter driver cmsis-dap
adapter speed 5000

# Include the RP2040 target config
source [find target/rp2040.cfg]

# Enable FreeRTOS Thread Awareness
# Note: This must come AFTER 'source [find target/rp2040.cfg]'
# because the 'pico.cpu0' target must be defined first.
rp2040.core0 configure -rtos FreeRTOS
